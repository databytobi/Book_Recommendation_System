[pytest]
# Root pytest configuration — the single source of truth for test settings.
#
# NOTE: a second pytest.ini previously existed at apps/api/pytest.ini with
# divergent settings (notably asyncio_mode, --strict-markers, and two invalid
# coverage_* options that pytest silently ignored). Whichever file pytest
# discovered first depended on the working directory, so async tests behaved
# differently depending on where they were run. That file has been removed and
# its meaningful settings consolidated here.

testpaths = apps/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Make `app` and `ml` importable when running from the repository root.
pythonpath =
    apps/api
    apps/api/ml

# Async tests are awaited automatically; no @pytest.mark.asyncio required.
asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --no-header

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use the database)
    slow: Tests that take a significant amount of time
    health: Health and readiness endpoint tests
    api: API endpoint tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning