name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: testing
      DEBUG: "True"
      SECRET_KEY: ci-only-test-secret-key-not-used-anywhere-else-0123456789
      JWT_SECRET: ci-only-test-jwt-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.11 to match the API Docker image. This workflow
          # previously used 3.12 while black's target-version said py312 and
          # the Dockerfile used 3.11 — three different answers.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff black pytest-cov

      - name: Lint (ruff)
        # Focused correctness rule set configured in apps/api/pyproject.toml.
        run: ruff check apps/api

      - name: Format check (black)
        # Informational only, not a gate. The repository was never formatted
        # with black, so enforcing it now would fail on ~100 pre-existing
        # files and block every unrelated change. Run `black <paths>` locally
        # to apply formatting. Correctness is enforced by the ruff step above.
        continue-on-error: true
        run: black --check apps/api/app apps/api/ml scripts

      - name: Test with pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build