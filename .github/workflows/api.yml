name: API CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/api/**"
      - "requirements.txt"
      - "Dockerfile"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/book_recommendation_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Postgres for testing
        run: |
          docker run --name test-postgres \
            -e POSTGRES_PASSWORD=root \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=book_recommendation_test \
            -p 5432:5432 \
            -d postgres:16-alpine

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            if docker exec test-postgres pg_isready -U postgres -d book_recommendation_test 2>/dev/null; then
              echo "Postgres is ready" && break
            fi
            echo "Waiting for Postgres..." && sleep 3
          done

      - name: Run tests
        run: |
          python -m pytest tests/api/ --cov=apps/api --cov-report=term-missing

      - name: Stop Postgres
        run: |
          docker stop test-postgres
          docker rm test-postgres

  build-image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ../..
          file: infrastructure/docker/api/Dockerfile
          push: true
          tags:
            ${{ secrets.DOCKERHUB_USERNAME }}/book-recommendation-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/book-recommendation-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ github.sha }}"
          echo "Triggering production deployment..."