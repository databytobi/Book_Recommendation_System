[pytest]
# Pytest configuration for the Book Recommendation System API

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add the current directory to Python path
pythonpath = .

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    health: Health check tests
    api: API endpoint tests

# Asyncio mode
asyncio_mode = auto

# Options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Minimum coverage
coverage_report = term-missing
coverage_ignore = venv/*