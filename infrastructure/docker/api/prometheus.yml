# Prometheus Configuration
# Path: infrastructure/docker/prometheus.yml

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  scrape_timeout: 10s       # Timeout for each scrape

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Scrape the API service
  - job_name: 'recommendation-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api:8000'
        labels:
          service: 'book-recommendation-api'
          environment: 'docker'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: 'prometheus'
          environment: 'docker'

  # Optional: Scrape Redis metrics
  - job_name: 'redis'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'redis:6379'
        labels:
          service: 'redis'
          environment: 'docker'

  # Optional: Scrape PostgreSQL metrics
  - job_name: 'postgres'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'postgres:5432'
        labels:
          service: 'postgres'
          environment: 'docker'