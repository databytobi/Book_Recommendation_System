# Prometheus Configuration
# Actual path: infrastructure/docker/api/prometheus.yml
# (The previous header claimed infrastructure/docker/prometheus.yml.)
#
# This is the development/standalone variant. The production Compose stack uses
# infrastructure/compose/prometheus.prod.yml.

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  scrape_timeout: 10s       # Timeout for each scrape

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Scrape the API service
  - job_name: 'recommendation-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api:8000'
        labels:
          service: 'book-recommendation-api'
          environment: 'docker'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: 'prometheus'
          environment: 'docker'

  # NOTE: Redis and PostgreSQL are NOT scraped. Neither exposes a Prometheus
  # endpoint on its native port, so jobs targeting redis:6379 / postgres:5432
  # would sit permanently down and fire constant false alerts. Use
  # redis_exporter / postgres_exporter if you need those metrics.