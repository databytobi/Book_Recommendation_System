<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" width="1680" height="1180"
     role="img" aria-labelledby="mlTitle mlDesc">
  <title id="mlTitle">Book Recommendation System — Data and ML Pipeline</title>
  <desc id="mlDesc">End-to-end pipeline: raw Book-Crossing and Goodreads datasets, per-source cleaning,
  integration and deduplication, feature engineering into a FAISS embedding index and an ALS interaction
  matrix, model training, offline evaluation, and serving through the API.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <style>
    .h1  { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill:#0f172a; }
    .sub { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; fill:#64748b; }
    .ph  { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill:#334155; letter-spacing:1.1px; }
    .bt  { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill:#0f172a; }
    .bx  { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 10.3px; fill:#475569; }
    .mn  { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 9.8px; fill:#475569; }
    .lbl { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill:#1e293b; }
    .note{ font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 10px; font-style: italic; fill:#64748b; }
  </style>

  <rect width="1680" height="1180" fill="#ffffff"/>
  <text class="h1" x="840" y="38" text-anchor="middle">Data &amp; Machine-Learning Pipeline</text>
  <text class="sub" x="840" y="61" text-anchor="middle">Offline batch path (scripts/ → ml/) producing the artifacts that the online API loads at request time</text>

  <!-- ============ 1. RAW ============ -->
  <rect x="40" y="84" width="1600" height="118" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text class="ph" x="56" y="105">1 · RAW DATA SOURCES</text>
  <text class="note" x="1624" y="105" text-anchor="end">data/raw/ · git-ignored</text>

  <rect x="64" y="114" width="500" height="76" rx="8" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="bt" x="78" y="135">Book-Crossing</text>
  <text class="mn" x="78" y="153">data/raw/Book-Crossing dataset/</text>
  <text class="bx" x="78" y="170">Books.csv (71 MB) · Ratings.csv (22 MB) · Users.csv (10 MB)</text>
  <text class="bx" x="78" y="185">→ ratings, users, popularity signal</text>

  <rect x="580" y="114" width="500" height="76" rx="8" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="bt" x="594" y="135">Goodreads</text>
  <text class="mn" x="594" y="153">data/raw/Goodreads dataset/books.csv</text>
  <text class="bx" x="594" y="170">1.5 MB · rich metadata</text>
  <text class="bx" x="594" y="185">→ descriptive text, ratings_count, publication data</text>

  <rect x="1096" y="114" width="520" height="76" rx="8" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="bt" x="1110" y="135">Profiling (exploratory)</text>
  <text class="mn" x="1110" y="153">scripts/data/profiling/profile_sweetviz.py</text>
  <text class="bx" x="1110" y="170">sweetviz HTML reports per dataset</text>
  <text class="mn" x="1110" y="185">reports/profiling/*_sweetviz.html</text>

  <!-- ============ 2. CLEANING ============ -->
  <line x1="314" y1="202" x2="314" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="830" y1="202" x2="830" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1356" y1="202" x2="1356" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="228" width="1600" height="212" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="ph" x="56" y="249">2 · PER-SOURCE CLEANING</text>
  <text class="mn" x="1624" y="249" text-anchor="end">scripts/data/scripts_cleaning/  →  data/processed/</text>

  <rect x="64" y="260" width="382" height="166" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
  <text class="bt" x="78" y="281">clean_books.py</text>
  <text class="mn" x="78" y="299">in: Books.csv (latin-1)</text>
  <text class="bx" x="78" y="318">· lowercase/strip columns, "-"→"_"</text>
  <text class="bx" x="78" y="333">· normalize title / author / publisher</text>
  <text class="bx" x="78" y="348">· clean_year(year_of_publication)</text>
  <text class="bx" x="78" y="363">· dropna(isbn) → drop_duplicates(isbn)</text>
  <text class="mn" x="78" y="384">out: books/books_cleaned.parquet</text>
  <text class="bx" x="78" y="403">Schema normalisation + de-duplication of the catalog.</text>

  <rect x="462" y="260" width="382" height="166" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
  <text class="bt" x="476" y="281">clean_ratings.py</text>
  <text class="mn" x="476" y="299">in: Ratings.csv (latin-1)</text>
  <text class="bx" x="476" y="318">· require user_id, isbn, book_rating</text>
  <text class="bx" x="476" y="333">· dropna → drop_duplicates(user_id, isbn)</text>
  <text class="bx" x="476" y="348">· split on rating: explicit &gt; 0</text>
  <text class="bx" x="476" y="363">· rating == 0 → implicit</text>
  <text class="mn" x="476" y="384">out: ratings_cleaned / _explicit / _implicit</text>
  <text class="bx" x="476" y="403">Produces the two feedback views used downstream.</text>

  <rect x="860" y="260" width="382" height="166" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
  <text class="bt" x="874" y="281">clean_users.py</text>
  <text class="mn" x="874" y="299">in: Users.csv (latin-1)</text>
  <text class="bx" x="874" y="318">· clean_age → drop_duplicates(user_id)</text>
  <text class="bx" x="874" y="333">· extract country from free-text location</text>
  <text class="bx" x="874" y="348">  (~100-entry mapping + comma fallback)</text>
  <text class="bx" x="874" y="363">· pycountry ISO-2 / ISO-3 enrichment</text>
  <text class="mn" x="874" y="384">out: users/users_cleaned.parquet</text>
  <text class="bx" x="874" y="403">Geographic + demographic enrichment of readers.</text>

  <rect x="1258" y="260" width="358" height="166" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
  <text class="bt" x="1272" y="281">clean_goodreads.py</text>
  <text class="mn" x="1272" y="299">in: books.csv (utf-8)</text>
  <text class="bx" x="1272" y="318">· 3-tier fallback CSV parse strategy</text>
  <text class="bx" x="1272" y="333">· normalize text fields, strip ISBNs</text>
  <text class="bx" x="1272" y="348">· map ~60 language codes → MARC-3</text>
  <text class="bx" x="1272" y="363">· to_datetime → publication_year; numerics</text>
  <text class="mn" x="1272" y="384">out: goodreads/goodreads_cleaned.parquet</text>
  <text class="bx" x="1272" y="403">Metadata enrichment source for the join.</text>

  <!-- ============ 3. INTEGRATION ============ -->
  <line x1="840" y1="440" x2="840" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="466" width="1600" height="176" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text class="ph" x="56" y="487">3 · INTEGRATION, VALIDATION &amp; DEDUPLICATION</text>
  <text class="mn" x="1624" y="487" text-anchor="end">scripts/data/integration/</text>

  <rect x="64" y="498" width="500" height="130" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text class="bt" x="78" y="519">merge_datasets.py</text>
  <text class="bx" x="78" y="538">· standardise ISBN: strip quotes/hyphens → upper</text>
  <text class="bx" x="78" y="553">· books LEFT JOIN goodreads ON isbn</text>
  <text class="bx" x="78" y="568">  suffixes (_bx, _gr), Goodreads wins on overlap</text>
  <text class="bx" x="78" y="583">· derive rating_category + is_english flags</text>
  <text class="bx" x="78" y="598">· emit orphan_ratings (ISBNs absent from catalog)</text>
  <text class="mn" x="78" y="617">out: integrated/master_books.parquet</text>

  <rect x="580" y="498" width="500" height="130" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text class="bt" x="594" y="519">schema_validator.py  (read-only gate)</text>
  <text class="bx" x="594" y="538">· duplicate ISBN / user checks</text>
  <text class="bx" x="594" y="553">· coverage %: title, author, language, rating, country</text>
  <text class="bx" x="594" y="568">· matrix sparsity, interactions per user/book</text>
  <text class="bx" x="594" y="583">· 10-point readiness score (≥7 = ready for hybrid)</text>
  <text class="bx" x="594" y="601">Fails fast before expensive embedding/training runs.</text>

  <rect x="1096" y="498" width="520" height="130" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text class="bt" x="1110" y="519">Catalog de-duplication</text>
  <text class="bx" x="1110" y="538">deduplicate_books.py — quality-score ranking</text>
  <text class="bx" x="1110" y="553">  (+100 rating, +10 title/author, +image, +count)</text>
  <text class="bx" x="1110" y="570">deduplicate_catalog.py — (title|author) key match</text>
  <text class="bx" x="1110" y="588">Both write the SAME output path; they are two</text>
  <text class="bx" x="1110" y="603">alternative strategies, not sequential stages.</text>
  <text class="mn" x="1110" y="620">out: master_books_deduplicated.parquet</text>

  <!-- ============ 4. FEATURES ============ -->
  <line x1="560" y1="642" x2="560" y2="672" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1240" y1="642" x2="1240" y2="672" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="40" y="672" width="1600" height="196" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text class="ph" x="56" y="693">4 · FEATURE ENGINEERING  (parallel branches)</text>
  <text class="mn" x="1624" y="693" text-anchor="end">apps/api/ml/features/  →  apps/api/ml/artifacts/</text>

  <rect x="64" y="704" width="760" height="150" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="bt" x="78" y="725">embedding_pipeline.py — semantic branch</text>
  <text class="bx" x="78" y="744">· semantic_text = title + authors + publisher + language_code</text>
  <text class="bx" x="78" y="759">· encode with sentence-transformers/all-MiniLM-L6-v2 (batch 256)</text>
  <text class="bx" x="78" y="774">· L2-normalise → float32 (so inner product ≡ cosine)</text>
  <text class="bx" x="78" y="789">· build faiss.IndexFlatIP over all vectors</text>
  <text class="mn" x="78" y="810">out: semantic_books.parquet · book_embeddings.npy</text>
  <text class="mn" x="78" y="825">     books_faiss.index · embedding_metadata.pkl</text>
  <text class="bx" x="78" y="845">Result: 248,176 books · 384 dimensions · cosine index</text>

  <rect x="840" y="704" width="776" height="150" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="bt" x="854" y="725">interaction_matrix.py — collaborative branch</text>
  <text class="bx" x="854" y="744">· in: data/processed/ratings/ratings_explicit.parquet</text>
  <text class="bx" x="854" y="759">· keep users with ≥ 5 interactions; split test_size=0.2, seed 42</text>
  <text class="bx" x="854" y="774">· build scipy csr_matrix (users × items), values = book_rating</text>
  <text class="bx" x="854" y="789">· persist user/item index mappings for inference-time translation</text>
  <text class="mn" x="854" y="810">out: train_interactions.parquet · test_interactions.parquet</text>
  <text class="mn" x="854" y="825">     interaction_matrix.npz · user_mapping / item_mapping.parquet</text>
  <text class="mn" x="854" y="840">     matrix_stats.txt · interaction_matrix_sample.csv</text>
  <text class="bx" x="854" y="858">This held-out split is what evaluation scores against.</text>

  <!-- ============ 5. TRAINING ============ -->
  <line x1="444" y1="854" x2="444" y2="898" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1228" y1="854" x2="1228" y2="898" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="40" y="898" width="1600" height="140" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text class="ph" x="56" y="919">5 · MODEL TRAINING</text>
  <text class="mn" x="1624" y="919" text-anchor="end">apps/api/ml/</text>

  <rect x="64" y="930" width="760" height="94" rx="8" fill="#fff" stroke="#67e8f9" stroke-width="1.5"/>
  <text class="bt" x="78" y="951">train_collaborative.py</text>
  <text class="bx" x="78" y="970">implicit.als.AlternatingLeastSquares · factors=64 · regularization=0.05 · iterations=20</text>
  <text class="bx" x="78" y="986">confidence = rating × 1.0 (floor 1.0) · LabelEncoder user_id / isbn · min 5 ratings per user and item</text>
  <text class="mn" x="78" y="1006">out: als_model.pkl · user_encoder.pkl · book_encoder.pkl · collaborative_metadata.pkl</text>

  <rect x="840" y="930" width="776" height="94" rx="8" fill="#fff" stroke="#67e8f9" stroke-width="1.5"/>
  <text class="bt" x="854" y="951">train_popularity.py</text>
  <text class="bx" x="854" y="970">PopularityRecommender.fit((ratings, books)) · min_ratings=50 · diversity_weight=0.3 · recency_weight=0.2</text>
  <text class="bx" x="854" y="986">Bayesian-style adjusted score with category-diversity and recency weighting</text>
  <text class="mn" x="854" y="1006">out: popularity_recommender.pkl · popularity_recommender_enhanced.pkl · popularity_scores.parquet</text>

  <!-- ============ 6. EVALUATION ============ -->
  <line x1="840" y1="1038" x2="840" y2="1062" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="1062" width="1600" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="ph" x="56" y="1083">6 · OFFLINE EVALUATION → 7 · SERVING</text>
  <text class="mn" x="1624" y="1083" text-anchor="end">ml/evaluation/</text>

  <rect x="64" y="1094" width="760" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="bt" x="78" y="1114">metrics.py — ranking &amp; beyond-accuracy metrics</text>
  <text class="mn" x="78" y="1134">P@K · R@K · hit_rate · AP/MAP@K · DCG/NDCG@K · MRR · catalog &amp; item coverage · diversity · novelty · serendipity</text>

  <rect x="840" y="1094" width="776" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="bt" x="854" y="1114">Serving — HybridRecommender (weighted fusion)</text>
  <text class="mn" x="854" y="1134">0.50·collaborative + 0.30·content + 0.20·popularity → rank → API response with per-book reason</text>

  <text class="note" x="840" y="1176" text-anchor="middle">Batch path is re-run whenever the catalog, ratings, or embedding model changes; the online API only ever reads the resulting artifacts (lazy-loaded, LRU-memoised), never the raw datasets.</text>
</svg>