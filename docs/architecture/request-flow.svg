<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1060" width="1720" height="1060"
     role="img" aria-labelledby="seqTitle seqDesc">
  <title id="seqTitle">Personalized Recommendation Request — Runtime Sequence</title>
  <desc id="seqDesc">Sequence diagram tracing one authenticated recommendation request from the browser through
  Next.js, the FastAPI router, the HybridRecommender score fusion, the ML services, PostgreSQL metadata
  enrichment, Redis caching and back to the UI.</desc>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="sr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .h1  { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 23px; font-weight: 700; fill:#0f172a; }
    .sub { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; fill:#64748b; }
    .lane{ font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 700; fill:#0f172a; }
    .lanes{font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 9.5px; fill:#64748b; }
    .msg { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill:#1e293b; }
    .ret { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill:#1d4ed8; }
    .lbl { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 700; fill:#0f172a; }
    .num { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 9.5px; font-weight: 700; fill:#ffffff; }
    .note{ font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 10px; font-style: italic; fill:#64748b; }
  </style>

  <rect width="1720" height="1060" fill="#ffffff"/>
  <text class="h1" x="860" y="38" text-anchor="middle">Personalized Recommendation Request — Runtime Sequence</text>
  <text class="sub" x="860" y="61" text-anchor="middle">GET /api/v1/recommendations?user_id=42 · authenticated · hybrid score fusion with cache + metadata enrichment</text>

  <!-- Lifelines -->
  <g>
    <line x1="120"  y1="152" x2="120"  y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="340"  y1="152" x2="340"  y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="580"  y1="152" x2="580"  y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="850"  y1="152" x2="850"  y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="1090" y1="152" x2="1090" y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="1330" y1="152" x2="1330" y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="1570" y1="152" x2="1570" y2="1010" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  </g>

  <!-- Lane headers -->
  <rect x="15"   y="110" width="210" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="lane"  x="120"  y="130" text-anchor="middle">User (Browser)</text>
  <text class="lanes" x="120"  y="145" text-anchor="middle">Next.js client runtime</text>

  <rect x="235"  y="110" width="210" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="lane"  x="340"  y="130" text-anchor="middle">Next.js Frontend</text>
  <text class="lanes" x="340"  y="145" text-anchor="middle">lib/api/client.ts + AuthProvider</text>

  <rect x="475"  y="110" width="210" height="42" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="lane"  x="580"  y="130" text-anchor="middle">FastAPI Router</text>
  <text class="lanes" x="580"  y="145" text-anchor="middle">middleware · auth dep · routes</text>

  <rect x="745"  y="110" width="210" height="42" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="lane"  x="850"  y="130" text-anchor="middle">HybridRecommender</text>
  <text class="lanes" x="850"  y="145" text-anchor="middle">weighted score fusion</text>

  <rect x="985"  y="110" width="210" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="lane"  x="1090" y="130" text-anchor="middle">ML Service Layer</text>
  <text class="lanes" x="1090" y="145" text-anchor="middle">collaborative · content</text>

  <rect x="1225" y="110" width="210" height="42" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="lane"  x="1330" y="130" text-anchor="middle">PostgreSQL</text>
  <text class="lanes" x="1330" y="145" text-anchor="middle">books · interactions</text>

  <rect x="1465" y="110" width="210" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="lane"  x="1570" y="130" text-anchor="middle">Redis Cache</text>
  <text class="lanes" x="1570" y="145" text-anchor="middle">TTL 3600s</text>

  <!-- 1 -->
  <circle cx="42" cy="226" r="9" fill="#2563eb"/><text class="num" x="42" y="230" text-anchor="middle">1</text>
  <line x1="120" y1="230" x2="334" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="128" y="224">open /dashboard/recommendations</text>

  <!-- 2 -->
  <circle cx="262" cy="270" r="9" fill="#2563eb"/><text class="num" x="262" y="274" text-anchor="middle">2</text>
  <line x1="340" y1="274" x2="574" y2="274" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="348" y="268">GET /api/v1/recommendations?user_id=42 · Authorization: Bearer &lt;JWT&gt;</text>

  <!-- 3 self -->
  <circle cx="482" cy="314" r="9" fill="#2563eb"/><text class="num" x="482" y="318" text-anchor="middle">3</text>
  <path d="M 580 318 L 700 318 L 700 336 L 586 336" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#s)"/>
  <text class="msg" x="712" y="332">CORS → MonitoringMiddleware → request logging → auth dependency validates JWT</text>

  <!-- 4 -->
  <circle cx="662" cy="358" r="9" fill="#2563eb"/><text class="num" x="662" y="362" text-anchor="middle">4</text>
  <line x1="580" y1="362" x2="844" y2="362" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="588" y="356">get_hybrid_recommender() → MLServiceRegistry (singleton)</text>

  <!-- 5 self -->
  <circle cx="752" cy="402" r="9" fill="#2563eb"/><text class="num" x="752" y="406" text-anchor="middle">5</text>
  <path d="M 850 406 L 970 406 L 970 424 L 856 424" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#s)"/>
  <text class="msg" x="982" y="420">ensure services loaded — lazy, happens once per process</text>

  <!-- 6 -->
  <circle cx="932" cy="446" r="9" fill="#2563eb"/><text class="num" x="932" y="450" text-anchor="middle">6</text>
  <line x1="850" y1="450" x2="1084" y2="450" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="858" y="444">collaborative.recommend_for_user(user, top_k×3)</text>

  <!-- 7 self -->
  <circle cx="992" cy="490" r="9" fill="#2563eb"/><text class="num" x="992" y="494" text-anchor="middle">7</text>
  <path d="M 1090 494 L 1190 494 L 1190 512 L 1096 512" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#s)"/>
  <text class="msg" x="1202" y="508">ALS latent-factor prediction (als_model.pkl)</text>

  <!-- 8 return -->
  <circle cx="932" cy="534" r="9" fill="#1d4ed8"/><text class="num" x="932" y="538" text-anchor="middle">8</text>
  <line x1="1090" y1="538" x2="856" y2="538" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="864" y="532">candidate ISBNs + collaborative scores</text>

  <!-- 9 -->
  <circle cx="932" cy="578" r="9" fill="#2563eb"/><text class="num" x="932" y="582" text-anchor="middle">9</text>
  <line x1="850" y1="582" x2="1084" y2="582" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="858" y="576">content.recommend_by_book(highest-rated history title, top_k×2)</text>

  <!-- 10 self -->
  <circle cx="992" cy="622" r="9" fill="#2563eb"/><text class="num" x="992" y="626" text-anchor="middle">10</text>
  <path d="M 1090 626 L 1190 626 L 1190 644 L 1096 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#s)"/>
  <text class="msg" x="1202" y="640">FAISS inner-product search over 384-dim vectors</text>

  <!-- 11 return -->
  <circle cx="932" cy="666" r="9" fill="#1d4ed8"/><text class="num" x="932" y="670" text-anchor="middle">11</text>
  <line x1="1090" y1="670" x2="856" y2="670" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="864" y="664">similar ISBNs + similarity scores</text>

  <!-- 12 self -->
  <circle cx="752" cy="710" r="9" fill="#2563eb"/><text class="num" x="752" y="714" text-anchor="middle">12</text>
  <path d="M 850 714 L 1010 714 L 1010 732 L 856 732" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#s)"/>
  <text class="msg" x="1022" y="728">min-max normalise each signal → 0.50·collab + 0.30·content + 0.20·popularity → rank + attach reason</text>

  <!-- 13 return -->
  <circle cx="662" cy="754" r="9" fill="#1d4ed8"/><text class="num" x="662" y="758" text-anchor="middle">13</text>
  <line x1="850" y1="758" x2="586" y2="758" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="594" y="752">ranked DataFrame (hybrid_score, reason), cold-start falls back to popularity</text>

  <!-- 14 -->
  <circle cx="952" cy="798" r="9" fill="#2563eb"/><text class="num" x="952" y="802" text-anchor="middle">14</text>
  <line x1="580" y1="802" x2="1324" y2="802" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="588" y="796">enrich with catalog metadata (title, authors, cover, rating, published year)</text>

  <!-- 15 return -->
  <circle cx="952" cy="842" r="9" fill="#1d4ed8"/><text class="num" x="952" y="846" text-anchor="middle">15</text>
  <line x1="1330" y1="846" x2="586" y2="846" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="594" y="840">book metadata rows</text>

  <!-- 16 -->
  <circle cx="1092" cy="886" r="9" fill="#2563eb"/><text class="num" x="1092" y="890" text-anchor="middle">16</text>
  <line x1="580" y1="890" x2="1564" y2="890" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text class="msg" x="588" y="884">cache the response (TTL 3600s) — subsequent identical requests short-circuit at step 4</text>

  <!-- 17 return -->
  <circle cx="452" cy="930" r="9" fill="#1d4ed8"/><text class="num" x="452" y="934" text-anchor="middle">17</text>
  <line x1="580" y1="934" x2="346" y2="934" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="354" y="928">200 OK · RecommendationResponse JSON</text>

  <!-- 18 return -->
  <circle cx="232" cy="974" r="9" fill="#1d4ed8"/><text class="num" x="232" y="978" text-anchor="middle">18</text>
  <line x1="340" y1="978" x2="126" y2="978" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text class="ret" x="134" y="972">render recommendation cards + reasons</text>

  <text class="note" x="860" y="1010" text-anchor="middle">Failure containment: steps 6–7 and 9–11 are individually try/except-guarded inside HybridRecommender — a missing collaborative or content signal degrades the response instead of failing the request.</text>
  <text class="note" x="860" y="1030" text-anchor="middle">Caching note: the hybrid recommender keeps an in-process cache (max 100 entries, TTL 3600s) in addition to the Redis tier shown here.</text>
</svg>